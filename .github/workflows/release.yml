name: Production release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to promote, for example v0.1.3
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    runs-on: ${{ fromJSON(vars.LBS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up release Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.0.0"
          cache: npm

      - name: Activate evidence-bound Intel release toolchain
        env:
          RELEASE_NODE_BIN: ${{ vars.LBS_RELEASE_NODE_BIN || '/usr/local/bin/node' }}
        run: |
          test "$RUNNER_OS" = "macOS"
          test "$RUNNER_ARCH" = "X64"
          test -x "$RELEASE_NODE_BIN"
          test "$("$RELEASE_NODE_BIN" -p 'process.version')" = "v26.0.0"
          test "$("$RELEASE_NODE_BIN" -p 'process.versions.zlib')" = "1.2.12"
          echo "$(dirname "$RELEASE_NODE_BIN")" >> "$GITHUB_PATH"

      - name: Validate tag and draft release
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          releases_json="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release_json="$(printf '%s' "$releases_json" | RELEASE_TAG="$RELEASE_TAG" node -e '
            const releases = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const release = releases.find((entry) => entry.tag_name === process.env.RELEASE_TAG && entry.draft);
            if (!release) {
              console.error(`No draft release found for ${process.env.RELEASE_TAG}.`);
              process.exit(1);
            }
            process.stdout.write(JSON.stringify(release));
          ')"
          test "$(printf '%s' "$release_json" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).draft')" = "true"
          RELEASE_ID="$(printf '%s' "$release_json" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).id')"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Install exact dependencies
        run: npm ci

      - name: Check repository policy
        run: npm run check

      - name: Validate plugin and public skill
        run: npm run validate

      - name: Run deterministic test suites
        run: npm test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Run browser checks
        run: npm run test:e2e

      - name: Download draft evidence assets
        run: |
          mkdir -p "$RUNNER_TEMP/release-evidence-downloads"
          release_json="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          for kind in automated sol native-macos-intel native-macos-apple-silicon; do
            name="learning-booklet-studio-$VERSION-$kind-evidence.tar.gz"
            asset_id="$(printf '%s' "$release_json" | NAME="$name" node -pe '
              const release = JSON.parse(require("fs").readFileSync(0, "utf8"));
              release.assets.find((asset) => asset.name === process.env.NAME)?.id ?? "";
            ')"
            if test -n "$asset_id"; then
              curl --fail-with-body --location --silent --show-error \
                -H "Accept: application/octet-stream" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                -o "$RUNNER_TEMP/release-evidence-downloads/$name"
            fi
          done
          for required_kind in automated sol native-macos-intel; do
            test -f "$RUNNER_TEMP/release-evidence-downloads/learning-booklet-studio-$VERSION-$required_kind-evidence.tar.gz"
          done

      - name: Extract evidence assets
        run: |
          set -o pipefail
          assert_safe_archive() {
            tar -tzf "$1" | node -e '
              const entries = require("fs").readFileSync(0, "utf8").split(/\r?\n/).filter(Boolean);
              const unsafe = entries.some((entry) => entry.startsWith("/") || entry.split("/").includes(".."));
              process.exit(unsafe ? 1 : 0);
            '
          }
          for kind in automated sol native-macos-intel; do
            archive="$RUNNER_TEMP/release-evidence-downloads/learning-booklet-studio-$VERSION-$kind-evidence.tar.gz"
            destination="$RUNNER_TEMP/release-evidence/$kind"
            if ! assert_safe_archive "$archive"; then
              echo "Unsafe path in evidence archive: $archive" >&2
              exit 1
            fi
            mkdir -p "$destination"
            tar -xzf "$archive" -C "$destination"
          done
          apple_archive="$RUNNER_TEMP/release-evidence-downloads/learning-booklet-studio-$VERSION-native-macos-apple-silicon-evidence.tar.gz"
          if test -f "$apple_archive"; then
            if ! assert_safe_archive "$apple_archive"; then
              echo "::warning::Ignoring unsafe optional Apple Silicon evidence archive; production remains governed by required gates."
            else
              mkdir -p "$RUNNER_TEMP/release-evidence/native-macos-apple-silicon"
              if ! tar -xzf "$apple_archive" -C "$RUNNER_TEMP/release-evidence/native-macos-apple-silicon"; then
                echo "::warning::Ignoring unreadable optional Apple Silicon evidence archive; production remains governed by required gates."
                rm -rf "$RUNNER_TEMP/release-evidence/native-macos-apple-silicon"
              fi
            fi
          fi

      - name: Build exact release inputs
        run: npm run build

      - name: Run fail-closed release verifier
        run: |
          verifier_args=(
            --test-evidence "$RUNNER_TEMP/release-evidence/automated/automated.json"
            --eval-evidence "$RUNNER_TEMP/release-evidence/sol/sol-eval.json"
            --native-intel-evidence "$RUNNER_TEMP/release-evidence/native-macos-intel/evidence.json"
          )
          apple_evidence="$RUNNER_TEMP/release-evidence/native-macos-apple-silicon/evidence.json"
          if test -f "$apple_evidence"; then
            verifier_args+=(--native-apple-silicon-evidence "$apple_evidence")
          else
            echo "::notice::Apple Silicon native evidence is not available or was unusable; recording a non-blocking advisory."
          fi
          node scripts/verify-oss-release.mjs "${verifier_args[@]}"

      - name: Assert production decision and checksums
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("dist/release/release-report.json", "utf8"));
          if (report.decision.status !== "pass") {
            throw new Error(`Production decision is ${report.decision.status}, not pass.`);
          }
          for (const gate of report.gates.filter((entry) => entry.productionRequired !== false)) {
            if (gate.status !== "pass") {
              throw new Error(`Release gate ${gate.id} is ${gate.status}.`);
            }
          }
          NODE
          (
            cd dist/release
            shasum -a 256 -c SHA256SUMS
          )

      - name: Attest release archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/release/learning-booklet-studio-${{ env.VERSION }}.tar.gz

      - name: Upload verified release assets
        run: |
          release_json="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          for asset in \
            "dist/release/learning-booklet-studio-$VERSION.tar.gz" \
            "dist/release/release-manifest.json" \
            "dist/release/release-report.json" \
            "dist/release/SHA256SUMS"; do
            name="$(basename "$asset")"
            existing_id="$(printf '%s' "$release_json" | NAME="$name" node -pe '
              const release = JSON.parse(require("fs").readFileSync(0, "utf8"));
              release.assets.find((entry) => entry.name === process.env.NAME)?.id ?? "";
            ')"
            if test -n "$existing_id"; then
              curl --fail-with-body --silent --show-error \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$existing_id"
            fi
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              >/dev/null
          done

      - name: Publish production release
        run: |
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -d '{"draft":false,"prerelease":false,"make_latest":"true"}' \
            >/dev/null

      - name: Retain production verification report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-verification-${{ inputs.tag }}
          path: |
            dist/release/release-report.json
            dist/release/release-manifest.json
            dist/release/SHA256SUMS
          if-no-files-found: warn
          retention-days: 90
